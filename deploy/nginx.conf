# Пример обратного прокси перед docker-compose (web слушает 127.0.0.1:8000).
# Сертификат: certbot --nginx -d crm.example.com (после продления: systemctl reload nginx).
server {
    listen 80;
    server_name crm.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name crm.example.com;

    ssl_certificate     /etc/letsencrypt/live/crm.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/crm.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    server_tokens off;
    client_max_body_size 5m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        # Перезаписываем, а не дописываем: клиент не может подделать свой IP для django-axes.
        proxy_set_header X-Forwarded-For $remote_addr;
        # Django доверяет этому заголовку (SECURE_PROXY_SSL_HEADER) — nginx обязан его выставлять.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
