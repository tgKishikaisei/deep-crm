# Продакшен-подобный запуск: gunicorn + whitenoise, Postgres и Redis без публичных портов.
#   cp .env.example .env   # заполнить значения
#   docker compose up -d --build
# Для разработки: docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
x-app: &app
  build: .
  image: deep-crm:latest
  env_file: .env
  environment:
    DB_HOST: db
    REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379
  read_only: true
  tmpfs:
    - /tmp
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  restart: unless-stopped

services:
  db:
    # Мажорная версия 15 (Debian) — как у существующего тома crm-system_postgres_data.
    image: postgres:15.19
    environment:
      POSTGRES_DB: ${DB_NAME:-crm_db}
      POSTGRES_USER: ${DB_USER:-crm}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7.4.11-alpine
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\" --appendonly yes"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Миграции — отдельным одноразовым шагом до старта web и celery.
  migrate:
    <<: *app
    command: ["python", "manage.py", "migrate", "--noinput"]
    depends_on:
      db: {condition: service_healthy}
    restart: "no"

  web:
    <<: *app
    ports:
      # Наружу только через обратный прокси (nginx/Caddy с TLS), см. deploy/nginx.conf.
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}

  celery:
    <<: *app
    command: ["celery", "-A", "crm_project", "worker", "-l", "info", "--concurrency", "2"]
    healthcheck:
      disable: true
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}

volumes:
  postgres_data:
  redis_data:
