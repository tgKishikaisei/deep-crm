<!-- templates/crm/deal_confirm_delete.html -->
{% extends 'base.html' %}

{% block title %}Подтверждение удаления{% endblock %}

{% block content %}
    <h1>Вы уверены, что хотите удалить сделку "{{ object.title }}"?</h1>
    <form method="post">
        {% csrf_token %}
        <p>Это действие нельзя будет отменить.</p>
        <button type="submit" class="btn btn-danger">Да, удалить</button>
        <a href="{% url 'crm:deal_detail' object.pk %}" class="btn btn-secondary">Отмена</a>
    </form>
{% endblock %}
