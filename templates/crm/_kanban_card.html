<div class="card kanban-card mb-3 animate-fade-in">
    <div class="card-body p-3">

        <!-- Заголовок (Название сделки) -->
        <h6 class="card-title mb-1 fw-bold">
            <a href="{% url 'crm:deal_detail' deal.pk %}" class="text-decoration-none glow-link stretched-link">
                {{ deal.title }}
            </a>
        </h6>

        <!-- Название клиента -->
        <div class="d-flex align-items-center mb-3">
            <i class="fa-regular fa-building me-2 text-secondary"></i>
            <small class="text-white-50">{{ deal.client.company_name }}</small>
        </div>

        <!-- Нижняя часть: Сумма и Кнопка -->
        <div class="d-flex justify-content-between align-items-end border-top border-white-10 pt-2 mt-2">

            <!-- Сумма (Неоновый зеленый) -->
            <div class="fw-bold" style="color: #2ecc71; font-size: 1.1rem; text-shadow: 0 0 10px rgba(46, 204, 113, 0.3);">
                {{ deal.amount|floatformat:0 }} ₽
            </div>

            <!-- Кнопка редактирования (Круглая, поверх ссылки) -->
            <a href="{% url 'crm:deal_update' deal.pk %}" class="btn btn-sm btn-icon-glass position-relative z-2" title="Редактировать">
                <i class="fa-solid fa-pen"></i>
            </a>
        </div>
    </div>
</div>
