name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies (hash-checked)
        run: pip install --require-hashes -r requirements.txt -r requirements-dev.txt
      - name: Migrations are in sync with models
        run: python manage.py makemigrations --check --dry-run --settings=crm_project.settings.test
      - name: Tests
        run: python manage.py test --settings=crm_project.settings.test
      - name: Deploy checklist
        env:
          SECRET_KEY: ci-only-deploy-check-key-0123456789-abcdefghijklmnopqrstuvwxyz
          ALLOWED_HOSTS: crm.example.com
        run: python manage.py check --deploy --fail-level WARNING --settings=crm_project.settings.prod
      - name: Dependency vulnerabilities
        run: pip-audit -r requirements.txt
      - name: Static security analysis
        run: bandit -r crm core users crm_project -ll

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t deep-crm:ci .

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks (вся история)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
